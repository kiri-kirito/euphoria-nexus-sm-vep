services:
  - type: web
    name: euphoria-nexus-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Set manually in Render Dashboard after deploy:
      # PORT (auto-set by Render), SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, FRONTEND_URL
